name: Minecraft Sources

# Menjalankan genSources (Loom mendekompilasi Minecraft 26.3 jadi source Java yang bisa dibaca),
# lalu mengunggah hasilnya sebagai artifact. Jalankan manual: tab Actions > "Minecraft Sources" > Run workflow.
on:
  workflow_dispatch:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: genSources
        run: gradle genSources --stacktrace

      - name: Kumpulkan hasil
        run: |
          mkdir -p out
          # Nama file TIDAK boleh diawali titik (upload-artifact mengabaikan file tersembunyi)
          find . "$HOME/.gradle" -name "*sources*.jar" 2>/dev/null | tee out/DAFTAR.txt
          for j in $(find . -path "*minecraftMaven/net/minecraft/*" -name "*-sources.jar" 2>/dev/null); do
            case "$j" in
              *clientOnly*) cp "$j" out/minecraft-clientOnly-sources.jar ;;
              *common*)     cp "$j" out/minecraft-common-sources.jar ;;
              *)            cp "$j" "out/minecraft-$(basename "$j")" ;;
            esac
          done
          ls -la out

      - name: Ekstrak paket yang relevan (lebih kecil)
        run: |
          mkdir -p selected
          for j in out/minecraft-*-sources.jar; do
            [ -f "$j" ] || continue
            unzip -q -o "$j" \
              'net/minecraft/client/Camera*' 'net/minecraft/client/Minecraft.java' 'net/minecraft/client/Options.java' \
              'net/minecraft/client/MouseHandler.java' 'net/minecraft/client/KeyMapping.java' \
              'net/minecraft/client/renderer/*' 'net/minecraft/client/gui/*' 'net/minecraft/client/player/*' \
              'net/minecraft/client/model/*' 'net/minecraft/client/particle/*' 'net/minecraft/client/multiplayer/*' \
              'net/minecraft/world/entity/player/*' 'net/minecraft/world/entity/LivingEntity.java' 'net/minecraft/world/item/Item.java' \
              'net/minecraft/server/level/ServerPlayer.java' 'net/minecraft/core/particles/*' 'com/mojang/blaze3d/*' \
              -d selected 2>/dev/null || true
          done
          (cd selected && zip -qr ../out/minecraft-sources-selected.zip . ) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-sources
          path: out/
          if-no-files-found: warn
          include-hidden-files: true
